<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Rigsmith — PC Building Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#06120e; --pcb:#0d2620; --pcb-2:#12332a; --pcb-3:#1a4436; --glass:rgba(9,28,22,.9); --glass-2:rgba(13,38,31,.94);
  --silk:#eef0e6; --silk-2:#b9c6bd; --silk-3:#7f9387;
  --copper:#d9844a; --copper-2:#f0a46c; --copper-ink:#2a1306;
  --steel:#8fa3b8; --amber:#ffb547; --red:#ff5d5d; --green:#5fe39a; --blue:#6cb6ff;
  --line:rgba(238,240,230,.12); --line-2:rgba(238,240,230,.24);
  --shadow:0 22px 60px rgba(0,0,0,.55);
  --font-d:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#06120e; --pcb:#0d2620; --silk:#eef0e6; --glass:rgba(9,28,22,.9); color-scheme:dark; } }
:root[data-theme="dark"]{ --page:#06120e; --pcb:#0d2620; --silk:#eef0e6; --glass:rgba(9,28,22,.9); color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--page);color:var(--silk);font-family:var(--font-b);font-size:15px;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--copper-2);outline-offset:2px}
.hidden{display:none!important}
.screen{position:fixed;inset:0;z-index:40}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:rgba(238,240,230,.04);color:var(--silk);font-family:var(--font-d);font-weight:600;font-size:14px;letter-spacing:.02em;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{background:rgba(238,240,230,.09);border-color:rgba(238,240,230,.4)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--copper);border-color:var(--copper);color:var(--copper-ink)}
.btn.pri:hover{background:var(--copper-2);border-color:var(--copper-2)}
.btn.warn{border-color:rgba(255,93,93,.55);color:#ffc9c9}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.38;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(238,240,230,.07);color:var(--silk-2);border:1px solid var(--line)}
.chip.ok{color:var(--green);border-color:rgba(95,227,154,.35)}
.chip.bad{color:var(--red);border-color:rgba(255,93,93,.4)}
.chip.amb{color:var(--amber);border-color:rgba(255,181,71,.4)}
.chip.cu{color:var(--copper-2);border-color:rgba(217,132,74,.45)}
.muted{color:var(--silk-3)}
.panel{background:var(--glass);border:1px solid var(--line);border-top:2px solid rgba(217,132,74,.55);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
input[type=text]{width:100%;height:42px;border-radius:10px;border:1px solid var(--line-2);background:rgba(0,0,0,.25);color:var(--silk);font:inherit;font-size:16px;padding:0 12px}
input[type=range]{width:100%;accent-color:var(--copper)}
select{height:38px;border-radius:9px;background:var(--pcb-2);color:var(--silk);border:1px solid var(--line-2);font:inherit;padding:0 8px}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:8px;height:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(238,240,230,.18);border-radius:8px}

/* ---------- loading ---------- */
#loading{display:grid;place-items:center;background:radial-gradient(120% 90% at 30% 20%,#123a2d 0%,#06120e 60%)}
.load-inner{width:min(420px,84vw)}
.logo{font-family:var(--font-d);font-weight:700;letter-spacing:.06em;color:var(--silk)}
#loading .logo{font-size:42px;margin-bottom:22px}
.bar{height:4px;background:rgba(238,240,230,.1);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--copper),var(--copper-2));transition:width .25s}
#loadText{margin-top:12px;color:var(--silk-3);font-size:14px}

/* ---------- main menu ---------- */
#menu{pointer-events:none}
#menu .menu-left{pointer-events:auto;position:absolute;left:calc(var(--safe-l) + clamp(20px,6vw,88px));top:50%;transform:translateY(-50%);width:min(420px,86vw)}
#menu h1{margin:0;font-size:clamp(46px,8vw,86px);line-height:.9;position:relative;display:inline-block;text-shadow:0 2px 30px rgba(0,0,0,.6)}
#menu h1 .led{position:absolute;right:-22px;top:10px;width:10px;height:10px;border-radius:2px;background:var(--green);box-shadow:0 0 12px var(--green),0 0 30px rgba(95,227,154,.6);animation:ledblink 2.4s infinite}
@keyframes ledblink{0%,70%,100%{opacity:1}75%,95%{opacity:.25}}
.trace{display:block;height:18px;margin:14px 0 18px;width:min(360px,80vw);background:
  linear-gradient(var(--copper),var(--copper)) 0 8px/62% 2px no-repeat,
  linear-gradient(var(--copper),var(--copper)) 62% 8px/2px 10px no-repeat,
  linear-gradient(var(--copper),var(--copper)) 62% 16px/30% 2px no-repeat,
  radial-gradient(circle at 92% 17px,var(--copper) 0 4px,transparent 4.5px),
  radial-gradient(circle at 2px 9px,var(--copper) 0 4px,transparent 4.5px);opacity:.9}
#menu .tag{margin:0 0 26px;color:var(--silk-2);font-size:17px;max-width:34ch}
.menu-nav{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.menu-nav button{background:none;border:0;padding:8px 0 8px 22px;font-family:var(--font-d);font-size:21px;font-weight:600;color:var(--silk);position:relative;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.menu-nav button::before{content:"";position:absolute;left:0;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;border:2px solid var(--copper);transition:background .15s}
.menu-nav button:hover,.menu-nav button:focus-visible{color:var(--copper-2)}
.menu-nav button:hover::before,.menu-nav button:focus-visible::before{background:var(--copper)}
.menu-nav button[disabled]{opacity:.35}
#menuFoot{margin-top:26px;font-size:13px;color:var(--silk-3)}

/* ---------- generic overlay panels ---------- */
#over{display:grid;place-items:center;background:rgba(3,10,8,.55);z-index:60}
#overCard{width:min(640px,94vw);max-height:min(86vh,760px);display:flex;flex-direction:column}
.ov-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.ov-head h2{margin:0;font-family:var(--font-d);font-size:22px}
.ov-body{padding:4px 18px 18px}
.ov-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.set-row{display:grid;grid-template-columns:1fr 1.2fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.set-row label{font-weight:500}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:8px;border:1px solid var(--line-2);background:transparent;font-size:13px;font-weight:600}
.seg button.on{background:var(--copper);color:var(--copper-ink);border-color:var(--copper)}
.sec-t{font-family:var(--font-d);font-size:15px;color:var(--copper-2);margin:16px 0 4px}
.slots{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.18)}
.slot img,.slot .noimg{width:120px;height:68px;border-radius:8px;object-fit:cover;background:var(--pcb-2)}
.slot .noimg{display:grid;place-items:center;color:var(--silk-3);font-size:12px}
.slot h4{margin:0 0 3px;font-family:var(--font-d);font-size:16px}
.slot p{margin:0;color:var(--silk-3);font-size:13px;line-height:1.35}
.slot .acts{display:flex;flex-direction:column;gap:6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.keys kbd{font-family:var(--font-d);font-weight:600;background:rgba(238,240,230,.08);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;white-space:nowrap}

/* ---------- character creation ---------- */
#create{pointer-events:none}
#createCard{pointer-events:auto;position:absolute;right:calc(var(--safe-r) + 18px);top:50%;transform:translateY(-50%);width:min(380px,92vw);padding:18px;max-height:88vh}
#createCard h2{margin:0 0 4px;font-family:var(--font-d)}
.sw-row{margin:12px 0 4px;font-weight:600;font-size:14px;color:var(--silk-2)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.sw button.on{border-color:var(--copper-2);box-shadow:0 0 0 3px rgba(217,132,74,.35)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#hudTL{position:absolute;left:calc(var(--safe-l) + 14px);top:calc(var(--safe-t) + 12px);display:flex;gap:8px;align-items:center}
.hud-pill{background:rgba(6,18,14,.62);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-family:var(--font-d);font-weight:600;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hudMoney{color:var(--green)}
#hudTR{position:absolute;right:calc(var(--safe-r) + 12px);top:calc(var(--safe-t) + 10px);display:flex;gap:8px;pointer-events:auto}
.hud-btn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(6,18,14,.62);display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hud-btn svg{width:22px;height:22px;stroke:var(--silk);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#objective{position:absolute;left:calc(var(--safe-l) + 14px);top:calc(var(--safe-t) + 56px);max-width:290px;font-size:13px;color:var(--silk-2);background:rgba(6,18,14,.5);border-left:2px solid var(--copper);padding:6px 10px;border-radius:0 8px 8px 0}
#objective b{color:var(--silk);font-weight:600}
#crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(238,240,230,.85);box-shadow:0 0 0 2px rgba(0,0,0,.35);transition:transform .12s}
#crosshair.hot{transform:scale(1.8);background:var(--copper-2)}
#prompt{position:absolute;left:50%;top:calc(50% + 26px);transform:translateX(-50%);background:rgba(6,18,14,.75);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;white-space:nowrap;display:none}
#prompt kbd{font-family:var(--font-d);background:var(--copper);color:var(--copper-ink);border-radius:5px;padding:0 6px;margin-right:6px;font-weight:700}
#toasts{position:fixed;top:calc(var(--safe-t) + 64px);left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,92vw)}
.toast{background:var(--glass-2);border:1px solid var(--line);border-left:3px solid var(--copper);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:var(--shadow);animation:tin .25s ease-out;max-width:100%}
.toast.ok{border-left-color:var(--green)}.toast.bad{border-left-color:var(--red)}.toast.amb{border-left-color:var(--amber)}
.toast b{font-family:var(--font-d)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#subtitle{position:fixed;left:50%;bottom:calc(var(--safe-b) + 110px);transform:translateX(-50%);max-width:min(640px,90vw);text-align:center;font-size:15px;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:8px;z-index:25;display:none}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:200;transition:opacity .6s}
#fps{position:fixed;left:calc(var(--safe-l) + 8px);bottom:calc(var(--safe-b) + 6px);font-size:11px;color:var(--silk-3);z-index:30;font-family:var(--font-d)}

/* ---------- mobile controls ---------- */
#mobile{position:fixed;inset:0;z-index:18;pointer-events:none}
#joy{position:absolute;left:calc(var(--safe-l) + 26px);bottom:calc(var(--safe-b) + 30px);width:128px;height:128px;border-radius:50%;background:rgba(6,18,14,.35);border:1px solid var(--line-2);pointer-events:auto}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(238,240,230,.22);border:1px solid rgba(238,240,230,.4)}
#mBtns{position:absolute;right:calc(var(--safe-r) + 18px);bottom:calc(var(--safe-b) + 26px);display:grid;grid-template-columns:repeat(2,64px);gap:12px;pointer-events:auto}
#mBtns button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line-2);background:rgba(6,18,14,.5);font-family:var(--font-d);font-weight:700;font-size:13px}
#mBtns button.big{background:rgba(217,132,74,.8);color:var(--copper-ink);border-color:var(--copper)}
#mBtns button.on{background:rgba(238,240,230,.25)}

/* ---------- build mode ---------- */
#build{position:fixed;inset:0;z-index:22;pointer-events:none}
#build > *{pointer-events:auto}
#bTop{position:absolute;top:calc(var(--safe-t) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#bTop::-webkit-scrollbar{display:none}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 6px 5px;border-radius:10px;border:1px solid transparent;background:transparent;font-size:11px;font-weight:600;color:var(--silk-2)}
.tb svg{width:22px;height:22px;stroke:var(--silk);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:rgba(238,240,230,.07)}
.tb.on{background:rgba(217,132,74,.2);border-color:rgba(217,132,74,.5);color:var(--copper-2)}
.tb.on svg{stroke:var(--copper-2)}
.tb.live svg{stroke:var(--green)}
#bTray{position:absolute;left:calc(var(--safe-l) + 10px);top:calc(var(--safe-t) + 86px);bottom:calc(var(--safe-b) + 12px);width:250px;display:flex;flex-direction:column}
.tray-head{padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.tray-head select{width:100%}
#trayList{flex:1;padding:8px;display:flex;flex-direction:column;gap:6px}
.pcard{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;text-align:left;padding:8px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.16)}
.pcard:hover{border-color:var(--line-2)}
.pcard.on{border-color:var(--copper);background:rgba(217,132,74,.16)}
.pcard .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--pcb-3);font-family:var(--font-d);font-size:10px;font-weight:700;color:var(--copper-2)}
.pcard .nm{font-size:13px;font-weight:600;line-height:1.2}
.pcard .sb{font-size:11.5px;color:var(--silk-3);margin-top:2px}
.tray-sec{font-family:var(--font-d);font-size:12px;color:var(--silk-3);margin:8px 2px 0}
#bCtx{position:absolute;left:50%;bottom:calc(var(--safe-b) + 14px);transform:translateX(-50%);width:min(560px,94vw);padding:12px 14px;display:none}
#bCtx h3{margin:0;font-family:var(--font-d);font-size:17px}
#bCtx .meta{font-size:13px;color:var(--silk-3);margin:3px 0 10px}
#bCtx .acts{display:flex;flex-wrap:wrap;gap:6px}
#bSide{position:absolute;right:calc(var(--safe-r) + 10px);top:calc(var(--safe-t) + 86px);width:300px;max-height:calc(100% - 110px - var(--safe-t) - var(--safe-b));display:none;flex-direction:column}
#bSide .ov-head{padding:12px 14px 6px}
#bSide .ov-head h2{font-size:18px}
#bSideBody{padding:4px 14px 14px}
.cab{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.cab small{display:block;color:var(--silk-3);font-size:12px}
.issue{padding:9px 10px;border-radius:10px;margin:8px 0;background:rgba(0,0,0,.2);border:1px solid var(--line);font-size:13.5px}
.issue.fail{border-color:rgba(255,93,93,.45)}.issue.warn{border-color:rgba(255,181,71,.4)}.issue.good{border-color:rgba(95,227,154,.4)}
.issue b{font-family:var(--font-d)}
#bHint{position:absolute;left:50%;bottom:calc(var(--safe-b) + 14px);transform:translateX(-50%);background:rgba(6,18,14,.72);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13.5px;max-width:min(560px,92vw);text-align:center;pointer-events:none}
#bTemps{position:absolute;right:calc(var(--safe-r) + 12px);bottom:calc(var(--safe-b) + 14px);display:none;gap:6px;flex-direction:column;align-items:flex-end;pointer-events:none}
#bTemps .hud-pill{font-size:13px}
.fp-grid{display:grid;grid-template-columns:repeat(5,34px);gap:6px;justify-content:center;margin:12px 0}
.fp-pin{width:34px;height:34px;border-radius:7px;border:1px solid var(--line-2);background:rgba(0,0,0,.25);font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--font-d)}
.fp-pin.sel{border-color:var(--copper);background:rgba(217,132,74,.25)}
.fp-pin.x{opacity:.3}
.fp-leads{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* ---------- monitor (in-game PC screen) ---------- */
#monitor{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.7)}
.bezel{width:min(1000px,96vw);aspect-ratio:16/9;max-height:84vh;background:#050505;border-radius:14px;padding:12px;box-shadow:0 0 0 2px #1d1d1f,var(--shadow);position:relative}
#scr{position:absolute;inset:12px;border-radius:4px;overflow:hidden;background:#000;color:#e8e8e8;font-family:var(--font-b);user-select:none}
#monClose{position:absolute;bottom:calc(var(--safe-b) + 14px);left:50%;transform:translateX(-50%)}
.bios{position:absolute;inset:0;background:linear-gradient(180deg,#141a22,#0b0e13);padding:2.2% 2.6%;font-size:clamp(10px,1.45vw,15px);display:grid;grid-template-rows:auto 1fr auto;gap:2%}
.bios h3{margin:0;font-family:var(--font-d);font-size:1.5em;color:#ff8d4a;letter-spacing:.04em}
.bios .cols{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:3%}
.bios .box{border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:4% 5%;background:rgba(255,255,255,.03)}
.bios .box h4{margin:0 0 6px;font-size:.95em;color:#9fb3c8;font-weight:600}
.bios .kv{display:flex;justify-content:space-between;gap:8px;margin:3px 0}
.bios .kv span:last-child{color:#fff;font-weight:600}
.bios .btns{display:flex;gap:10px;justify-content:flex-end}
.bios button,.os button{border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;padding:.5em 1em;font-size:1em}
.bios button.hot{background:#c4561c;border-color:#c4561c}
.post{position:absolute;inset:0;background:#000;display:grid;place-items:center;font-size:clamp(11px,1.6vw,17px);text-align:center}
.post .brand{font-family:var(--font-d);font-size:3.2em;font-weight:700;letter-spacing:.12em;color:#f2f2f2}

.os{position:absolute;inset:0;font-size:clamp(10px,1.4vw,15px);color:#f3f3f3}

.os .setup{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:64%;min-height:58%;background:rgba(250,250,250,.96);color:#1b1b1b;border-radius:10px;padding:3% 3.4%;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:3%}

.os .setup h3{margin:0;font-weight:600;font-size:1.45em}

.os .setup .opts{display:flex;flex-direction:column;gap:6px}
.os .setup .opt{display:flex;justify-content:space-between;align-items:center;padding:.6em .9em;border-radius:6px;border:1px solid #ccc;background:#fff;color:#1b1b1b;text-align:left}

.prog{height:8px;background:#ddd;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:#1f6fb6;width:0}

.desk{position:absolute;inset:0}

.desk .wm{position:absolute;right:2%;bottom:9%;text-align:right;opacity:.75;font-size:.9em}
.win-app{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:70%;height:72%;background:#1b1f26;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.win-app .tt{height:2.4em;display:flex;align-items:center;justify-content:space-between;padding:0 .9em;background:#252b34;font-weight:600}

.gauge{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em;margin:.8em 0}
.gauge div{background:rgba(255,255,255,.05);border-radius:8px;padding:.6em;text-align:center}

.crash{position:absolute;inset:0;background:#122a52;color:#fff;padding:6% 8%;font-size:clamp(11px,1.6vw,17px)}
.crash h3{font-size:2.4em;margin:0 0 .4em;font-weight:500}

/* ---------- phone / computer ---------- */
#phone{position:fixed;z-index:45;right:calc(var(--safe-r) + 18px);bottom:calc(var(--safe-b) + 16px);width:390px;height:min(780px,calc(100% - var(--safe-t) - var(--safe-b) - 32px));display:flex}
#phone.desk{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(1100px,96vw);height:min(720px,88vh)}
.ph-frame{flex:1;display:flex;flex-direction:column;background:#071510;border-radius:38px;border:10px solid #111416;box-shadow:0 0 0 1px #2a2f33,var(--shadow);overflow:hidden}
#phone.desk .ph-frame{border-radius:14px;border-width:8px}
.ph-status{display:flex;justify-content:space-between;padding:10px 22px 6px;font-size:12.5px;font-weight:600;color:var(--silk-2);font-family:var(--font-d)}
#phBody{flex:1;display:flex;flex-direction:column;min-height:0}
.ph-home{height:24px;display:grid;place-items:center;cursor:pointer}
.ph-home::after{content:"";width:120px;height:5px;border-radius:3px;background:rgba(238,240,230,.5)}
#phone.desk .ph-home{display:none}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;padding:18px 14px}
#phone.desk .apps{grid-template-columns:repeat(6,1fr);max-width:820px;margin:0 auto;width:100%;padding:36px}
.app{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--silk-2);position:relative}

.ph-wall{padding:22px 18px 4px}
.ph-wall .clock{font-family:var(--font-d);font-size:46px;font-weight:600;line-height:1}
.ph-wall .date{color:var(--silk-3);font-size:14px;margin-top:4px}
.ah{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;border-bottom:1px solid var(--line)}
.ah h3{margin:0;font-family:var(--font-d);font-size:18px;flex:1}
.ah .back{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.ah .back svg{width:18px;height:18px;stroke:var(--silk);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ab{flex:1;padding:10px 12px 16px;min-height:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;touch-action:pan-x;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:12.5px;font-weight:600;color:var(--silk-2)}

.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(238,240,230,.04);border:1px solid var(--line);margin-bottom:8px}
.li h4{margin:0;font-size:14.5px;font-weight:600;line-height:1.25}

.li .pr{font-family:var(--font-d);font-weight:700;font-size:15px;text-align:right}
.li .pr s{color:var(--silk-3);font-weight:500;font-size:12px;display:block}
.li .side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.deal{color:var(--amber)}
.row-sum{display:flex;justify-content:space-between;padding:6px 2px;font-size:14px}
.row-sum.tot{font-family:var(--font-d);font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.pp-slot{padding:10px;border-radius:12px;border:1px dashed var(--line-2);margin-bottom:8px}
.pp-slot.fill{border-style:solid;background:rgba(238,240,230,.04)}
.pp-slot .t{font-size:12px;color:var(--copper-2);font-family:var(--font-d);font-weight:600}
.note{font-size:12.5px;padding:7px 9px;border-radius:9px;margin:4px 0;background:rgba(0,0,0,.2)}
.note.ok{color:var(--green)}.note.bad{color:#ffb3b3}.note.amb{color:var(--amber)}
.msg-b{max-width:85%;padding:8px 11px;border-radius:14px;margin:6px 0;font-size:13.5px;line-height:1.35}
.msg-b.in{background:rgba(238,240,230,.08);border-bottom-left-radius:4px}
.msg-b.out{background:var(--copper);color:var(--copper-ink);margin-left:auto;border-bottom-right-radius:4px}
.stars{color:var(--amber);letter-spacing:1px}
.mapbox{position:relative;border-radius:14px;overflow:hidden;background:#0a1f18;border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.empty{padding:28px 12px;text-align:center;color:var(--silk-3);font-size:14px}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin:6px 0;background:var(--pcb-2)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(2,8,6,.55)}
#modalCard{width:min(460px,92vw);max-height:86vh;padding:18px}
#modalCard h3{margin:0 0 6px;font-family:var(--font-d);font-size:20px}
#modalCard .specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:10px 0}
#modalCard .specs span:nth-child(odd){color:var(--silk-3)}
.m-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}

/* ---------- pause ---------- */
#pause{display:grid;place-items:center;background:rgba(3,10,8,.6);z-index:55}
#pauseCard{width:min(360px,90vw);padding:22px;display:flex;flex-direction:column;gap:8px}
#pauseCard h2{margin:0 0 8px;font-family:var(--font-d)}
#pauseCard .btn{justify-content:flex-start;min-height:46px;font-size:15px}

@media (max-width:820px){
  #bTray{left:0;right:0;top:auto;bottom:calc(var(--safe-b) + 0px);width:auto;height:150px;border-radius:16px 16px 0 0;flex-direction:column}
  .tray-head{display:flex;gap:8px;align-items:center;padding:8px 10px}
  #trayList{flex-direction:row;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;padding:8px}
  .pcard{min-width:190px;max-width:190px}
  .tray-sec{display:none}
  #bCtx{bottom:calc(var(--safe-b) + 160px)}
  #bHint{bottom:calc(var(--safe-b) + 162px);font-size:12.5px}
  #bTemps{bottom:calc(var(--safe-b) + 166px)}
  #bSide{left:10px;right:10px;width:auto;top:calc(var(--safe-t) + 80px);max-height:calc(100% - 250px - var(--safe-t) - var(--safe-b))}
  #phone:not(.desk){left:0;right:0;bottom:0;top:0;width:auto;height:auto}
  #phone:not(.desk) .ph-frame{border-radius:0;border-width:0}
  #phone:not(.desk) .ph-status{padding-top:calc(var(--safe-t) + 8px)}
  #createCard{right:auto;left:50%;top:auto;bottom:calc(var(--safe-b) + 12px);transform:translateX(-50%);max-height:56vh;overflow:auto}
  #menu .menu-left{top:auto;bottom:calc(var(--safe-b) + 28px);transform:none}
  .slot{grid-template-columns:84px 1fr}
  .slot img,.slot .noimg{width:84px;height:48px}
  .slot .acts{grid-column:1/-1;flex-direction:row}
}
@media (prefers-reduced-motion: reduce){ #menu h1 .led{animation:none} .toast{animation:none} .nosig div{animation:none} }
</style>

// ---------------- Ambience ----------------
const Amb = (() => {

    const L = Audio.loop;

    M.loops.rain = L({ type: 'highpass', f: 1200, q: 0.3 });
    M.loops.rainRoof = L({ type: 'bandpass', f: 500, q: 0.6 });
    M.loops.crowd = L({ type: 'bandpass', f: 520, q: 0.9, wet: 0.3 });
    M.loops.room = L({ type: 'lowpass', f: 140, q: 0.7, tone: 60, toneType: 'sine' });
    M.loops.crickets = null; // generated by pulse below
    M.cr = (() => { if (!Audio.ready) return null; const c = Audio.ctx; const o = c.createOscillator(); o.frequency.value = 4700; const g = c.createGain(); g.gain.value = 0; const lfo = c.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 14; const lg = c.createGain(); lg.gain.value = 0.5; lfo.connect(lg); const am = c.createGain(); am.gain.value = 0.5; lg.connect(am.gain); o.connect(am); am.connect(g); g.connect(Audio.buses.amb); o.start(); lfo.start(); return g; })();
  };
  M.update = function (dt, zone, hour, rain, indoors) {
    if (!Audio.ready || !M.loops.wind) return;
    const day = hour > 6 && hour < 19.5, night = !day;
    const out = indoors ? 0 : 1;
    M.loops.wind.set(0.05 * out + 0.012 * (1 - out) + rain * 0.04, 300 + rain * 300);
    M.loops.rain.set(rain * (indoors ? 0.02 : 0.16), indoors ? 2200 : 1500);
    M.loops.rainRoof.set(rain * (indoors ? 0.1 : 0.02), 450);
    M.loops.crowd.set(zone === 'store' ? 0.09 : 0, 500 + Math.sin(performance.now() / 900) * 80);
    M.loops.room.set(indoors ? 0.012 : 0, 130, indoors ? (zone === 'garage' ? 0.012 : 0.006) : 0);
    if (M.cr) M.cr.gain.setTargetAtTime(night && !indoors && rain < 0.2 ? 0.006 : 0, Audio.ctx.currentTime, 0.5);

  };
  return M;
})();
